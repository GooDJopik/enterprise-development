name: .NET Tests

on:
  push:
    branches: [ Lab_1, Lab_3, main ]
  pull_request:
    branches: [ Lab_1, Lab_3, main ]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Car/CarRental.sln

      - name: Build
        run: dotnet build Car/CarRental.sln --configuration Release --no-restore

      - name: Test
        run: |
            chcp 65001
            dotnet test Car/CarRental.Tests/CarRental.Tests.csproj --verbosity normal